appId: com.beexofficial.beex.test
productName: AI Workbench
directories:
  output: build/mac
files:
  - dist/**/*
  - electron/**/*
  - src/core/**/*.js
  - public/icons/**/*
  - package.json
  - "!node_modules/@capacitor/**"
  - "!node_modules/@phosphor-icons/**"
  - "!node_modules/@vitejs/**"
  - "!node_modules/vite/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/scheduler/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@esbuild/**"
  - "!node_modules/rollup/**"
  - "!node_modules/@rollup/**"
  - "!node_modules/fsevents/**"
  - "!node_modules/@babel/**"
  - "!node_modules/browserslist/**"
  - "!node_modules/caniuse-lite/**"
  - "!node_modules/electron-to-chromium/**"
  - "!node_modules/update-browserslist-db/**"
mac:
  icon: public/icons/workbench.icns
  category: public.app-category.developer-tools
  entitlements: electron/entitlements/mac.plist
  entitlementsInherit: electron/entitlements/mac.inherit.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    ITSAppUsesNonExemptEncryption: false
    NSMicrophoneUsageDescription: AI Workbench 使用麦克风把语音转成任务文本。
    NSSpeechRecognitionUsageDescription: AI Workbench 使用语音识别把你的语音转成文字。
  target:
    - dir
win:
  icon: public/icons/workbench.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: AI-Workbench-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Workbench
mas:
  type: distribution
  entitlements: electron/entitlements/mas.plist
  entitlementsInherit: electron/entitlements/mas.inherit.plist
  hardenedRuntime: true
  gatekeeperAssess: false
masDev:
  type: development
  entitlements: electron/entitlements/mas.plist
  entitlementsInherit: electron/entitlements/mas.inherit.plist
  hardenedRuntime: true
  gatekeeperAssess: false
asar: true
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
